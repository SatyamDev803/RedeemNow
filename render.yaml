# Render blueprint for the RedeemNow dashboard.
#
# This is a pnpm workspace, so the build runs from the REPO ROOT (not web/) — the web package
# depends on @redeemnow/shared via `workspace:*`, which cannot resolve from inside web/.
#
# Contract addresses are baked into the bundle at build time from
# packages/shared/deployments/*.json, tracked in git precisely so this works. No secrets: every
# value the app reads is public chain state over a public RPC.
services:
  - type: web
    name: redeemnow
    runtime: node
    plan: free
    region: singapore
    branch: main
    # `npm i -g pnpm@10.0.0` rather than `corepack enable`: corepack needs to write into the Node
    # install and is the usual cause of a "pnpm: not found" build on Render. The version is pinned
    # to package.json's `packageManager` so the build resolves deps with the same pnpm we develop on.
    #
    # `--frozen-lockfile` deliberately. A build that may re-resolve the dependency tree can install
    # versions nobody tested, which is the whole point of committing a lockfile; the deployed bundle
    # must be built from the exact tree in git. `pnpm install --frozen-lockfile` is verified to
    # succeed against this lockfile, so a failure here means the lockfile is genuinely stale and
    # should be regenerated and committed — not worked around at deploy time.
    buildCommand: npm i -g pnpm@10.0.0 && pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.20.0"
      - key: NODE_ENV
        value: production
      # The free plan caps at 512MB and a Next build will OOM against the default V8 heap. This is
      # the most common silent "deploy failed" on this tier.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
