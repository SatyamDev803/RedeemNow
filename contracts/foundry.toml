[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Required for Sourcify verification on Monad's explorer, and REQUIRED BEFORE DEPLOYING:
# these settings change the emitted bytecode, so a contract deployed without them cannot be
# verified afterwards without redeploying.
#   metadata_hash = "none"    strips the IPFS hash trailer, which otherwise differs per machine
#   use_literal_content       embeds sources in the metadata so the verifier needs no file layout
# Verify with:
#   forge verify-contract <addr> <Name> --chain 10143 \
#     --verifier sourcify --verifier-url https://sourcify-api-monad.blockvision.org/
# (trailing slash matters). Result appears at
#   https://testnet.monadexplorer.com/contracts/full_match/10143/<addr>/
bytecode_hash = "none"
cbor_metadata = false
use_literal_content = true

fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./fixtures" }
]

[fuzz]
runs = 256

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 110
